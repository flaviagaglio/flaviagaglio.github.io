<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Keys · Flavia Gaglio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background:
                radial-gradient(circle at 50% 0%, rgba(224, 185, 115, 0.08) 0%, transparent 55%),
                linear-gradient(160deg, #14100c 0%, #0a0806 100%);
            font-family: 'Lato', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .container {
            max-width: 1300px;
            width: 100%;
            background: rgba(24, 19, 15, 0.75);
            backdrop-filter: blur(14px);
            border-radius: 30px;
            padding: 1.5rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(212, 168, 90, 0.06);
            border: 1px solid rgba(212, 175, 122, 0.22);
        }
        @media (min-width: 768px) {
            .container {
                padding: 2.5rem;
                border-radius: 50px;
            }
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(180deg, #f3d9a4 0%, #c99a4e 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 24px rgba(224, 185, 115, 0.25);
            margin-bottom: 0.5rem;
        }
        @media (min-width: 768px) {
            h1 { font-size: 4rem; }
        }
        .byline {
            text-align: center;
            font-size: 1.2rem;
            color: #a68a5f;
            font-style: italic;
            border-bottom: 2px dotted rgba(201, 160, 100, 0.4);
            display: table;
            padding-bottom: 0.3rem;
            margin: 0 auto 1.5rem;
            width: auto;
        }
        @media (min-width: 768px) {
            .byline { font-size: 1.3rem; margin-bottom: 2rem; }
        }
        .selector-area {
            background: rgba(14, 11, 8, 0.55);
            border-radius: 30px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(201, 160, 100, 0.2);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 10px 24px rgba(0,0,0,0.35);
        }
        @media (min-width: 768px) {
            .selector-area {
                padding: 2rem;
                border-radius: 40px;
            }
        }
        .selector-label {
            text-align: center;
            color: #c9a877;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        @media (min-width: 768px) {
            .selector-label {
                font-size: 1rem;
                letter-spacing: 3px;
                margin-bottom: 1.5rem;
            }
        }
        .note-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1rem;
        }
        .note-btn {
            background: #1c1611;
            border: 1px solid rgba(212, 175, 122, 0.35);
            color: #e2cba3;
            padding: 0.6rem 0.8rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            font-family: 'Playfair Display', serif;
            cursor: pointer;
            box-shadow: 0 4px 0 #0d0a07;
            transition: all 0.1s ease;
            min-width: 70px;
            flex: 0 1 auto;
        }
        @media (min-width: 480px) {
            .note-btn {
                padding: 0.8rem 1.2rem;
                font-size: 1rem;
                min-width: 80px;
            }
        }
        @media (min-width: 768px) {
            .note-btn {
                padding: 1rem 1.5rem;
                font-size: 1.2rem;
                min-width: 90px;
                box-shadow: 0 6px 0 #0d0a07;
            }
        }
        .note-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0d0a07;
        }
        .note-btn.selected {
            background: linear-gradient(180deg, #e7c583 0%, #c99a4e 100%);
            border-color: #f3d9a4;
            color: #211708;
            box-shadow: 0 4px 0 #7a5a2e;
        }
        @media (min-width: 768px) {
            .note-btn.selected {
                box-shadow: 0 6px 0 #7a5a2e;
            }
        }
        .calculate-btn {
            background: linear-gradient(180deg, #e7c583 0%, #c99a4e 100%);
            color: #211708;
            border: none;
            padding: 1rem 2rem;
            border-radius: 40px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            max-width: 350px;
            margin: 1rem auto 0;
            display: block;
            text-transform: uppercase;
            box-shadow: 0 8px 0 #7a5a2e, 0 12px 30px rgba(212, 168, 90, 0.2);
            border: 1px solid #f3d9a4;
            transition: all 0.1s ease;
        }
        @media (min-width: 768px) {
            .calculate-btn {
                padding: 1.2rem 3rem;
                font-size: 1.3rem;
                max-width: 400px;
                box-shadow: 0 10px 0 #7a5a2e, 0 14px 34px rgba(212, 168, 90, 0.22);
            }
        }
        .calculate-btn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #7a5a2e;
        }
        .results-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-top: 2rem;
        }
        @media (min-width: 600px) {
            .results-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (min-width: 1024px) {
            .results-grid {
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            }
        }
        .result-card {
            background: rgba(20, 16, 12, 0.85);
            border-radius: 25px;
            padding: 1.5rem;
            border: 1px solid rgba(212, 175, 122, 0.25);
            box-shadow: 0 10px 24px rgba(0,0,0,0.4);
            text-align: center;
        }
        .key-name {
            font-size: 2rem;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: #f3d9a4;
            margin-bottom: 0.3rem;
        }
        @media (min-width: 768px) {
            .key-name { font-size: 2.5rem; }
        }
        .relative-minor {
            font-size: 1.1rem;
            color: #a68a5f;
            margin-bottom: 1rem;
            font-style: italic;
        }
        .accidentals-count {
            font-size: 1rem;
            color: #c9a877;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .accidentals-list {
            font-size: 1.8rem;
            font-family: 'Playfair Display', serif;
            background: rgba(10, 8, 6, 0.6);
            padding: 0.8rem;
            border-radius: 40px;
            display: inline-block;
            border: 1px solid rgba(212, 175, 122, 0.3);
        }
        .accidental-note {
            display: inline-block;
            margin: 0 0.2rem;
            font-weight: 700;
        }
        .sharp { color: #e0a84f; }
        .flat { color: #c97b63; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎼 KEYS</h1>
        <div class="byline">by Flavia Gaglio</div>

        <div class="selector-area">
            <div class="selector-label">circolo delle quinte</div>
            <div class="note-grid" id="noteGrid"></div>
            <button class="calculate-btn" id="calculate">✨ scopri l'armatura ✨</button>
        </div>

        <div id="resultsContainer" class="results-grid"></div>
    </div>

    <script>
        (function() {
            // Ordine di comparsa delle alterazioni nel circolo delle quinte
            // (i bemolli seguono l'ordine esattamente inverso dei diesis).
            const SHARP_ORDER = ["Fa", "Do", "Sol", "Re", "La", "Mi", "Si"];
            const FLAT_ORDER  = ["Si", "Mi", "La", "Re", "Sol", "Do", "Fa"];

            // Ogni tonalità è definita solo da quante alterazioni ha e di che
            // tipo: le note alterate si calcolano prendendo le prime `count`
            // note di SHARP_ORDER/FLAT_ORDER, non vanno elencate a mano.
            const MAJOR_SIGNATURES = {
                "Do":    { count: 0, type: 'none' },
                "Do♭":   { count: 7, type: 'b' },
                "Do♯":   { count: 7, type: '#' },
                "Re♭":   { count: 5, type: 'b' },
                "Re":    { count: 2, type: '#' },
                "Mi♭":   { count: 3, type: 'b' },
                "Mi":    { count: 4, type: '#' },
                "Fa":    { count: 1, type: 'b' },
                "Fa♯":   { count: 6, type: '#' },
                "Sol♭":  { count: 6, type: 'b' },
                "Sol":   { count: 1, type: '#' },
                "Sol♯":  { count: 5, type: '#' },
                "La♭":   { count: 4, type: 'b' },
                "La":    { count: 3, type: '#' },
                "Si♭":   { count: 2, type: 'b' },
                "Si":    { count: 5, type: '#' }
            };

            function getAccidentals(count, type) {
                if (type === 'none' || count === 0) return [];
                const order = type === '#' ? SHARP_ORDER : FLAT_ORDER;
                const symbol = type === '#' ? '♯' : '♭';
                return order.slice(0, count).map(nota => nota + symbol);
            }

            const NOTE_LABELS = [
                "Do", "Sol", "Re", "La", "Mi", "Si/Do♭", "Fa♯/Sol♭", "Re♭/Do♯",
                "La♭", "Mi♭", "Si♭", "Fa"
            ];

            const TONALITA_PER_ETICHETTA = {
                "Do": [ { maggiore: "Do", minore: "La" } ],
                "Sol": [ { maggiore: "Sol", minore: "Mi" } ],
                "Re": [ { maggiore: "Re", minore: "Si" } ],
                "La": [ { maggiore: "La", minore: "Fa♯" } ],
                "Mi": [ { maggiore: "Mi", minore: "Do♯" } ],
                "Si/Do♭": [
                    { maggiore: "Si", minore: "Sol♯" },
                    { maggiore: "Do♭", minore: "La♭" }
                ],
                "Fa♯/Sol♭": [
                    { maggiore: "Fa♯", minore: "Re♯" },
                    { maggiore: "Sol♭", minore: "Mi♭" }
                ],
                "Re♭/Do♯": [
                    { maggiore: "Re♭", minore: "Si♭" },
                    { maggiore: "Do♯", minore: "La♯" }
                ],
                "La♭": [ { maggiore: "La♭", minore: "Fa" } ],
                "Mi♭": [ { maggiore: "Mi♭", minore: "Do" } ],
                "Si♭": [ { maggiore: "Si♭", minore: "Sol" } ],
                "Fa": [ { maggiore: "Fa", minore: "Re" } ]
            };

            let selectedIndex = 0;
            const noteGrid = document.getElementById('noteGrid');
            const calculateBtn = document.getElementById('calculate');
            const resultsContainer = document.getElementById('resultsContainer');

            NOTE_LABELS.forEach((label, idx) => {
                const btn = document.createElement('button');
                btn.className = 'note-btn' + (idx === 0 ? ' selected' : '');
                btn.textContent = label;
                btn.dataset.index = idx;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedIndex = idx;
                });
                noteGrid.appendChild(btn);
            });

            function createCard(maggiore, minore) {
                const sig = MAJOR_SIGNATURES[maggiore];
                if (!sig) return null;

                const card = document.createElement('div');
                card.className = 'result-card';

                const nameEl = document.createElement('div');
                nameEl.className = 'key-name';
                nameEl.textContent = `${maggiore} maggiore`;
                card.appendChild(nameEl);

                const relEl = document.createElement('div');
                relEl.className = 'relative-minor';
                relEl.textContent = `relativa minore: ${minore}`;
                card.appendChild(relEl);

                if (sig.count === 0) {
                    const countEl = document.createElement('div');
                    countEl.className = 'accidentals-count';
                    countEl.textContent = 'nessuna alterazione';
                    card.appendChild(countEl);
                    const listEl = document.createElement('div');
                    listEl.className = 'accidentals-list';
                    listEl.innerHTML = '♮';
                    card.appendChild(listEl);
                } else {
                    const tipo = sig.type === '#' ? 'diesis' : 'bemolli';
                    const countEl = document.createElement('div');
                    countEl.className = 'accidentals-count';
                    countEl.textContent = `${sig.count} ${tipo}`;
                    card.appendChild(countEl);

                    const listEl = document.createElement('div');
                    listEl.className = 'accidentals-list';
                    const classe = sig.type === '#' ? 'sharp' : 'flat';
                    listEl.innerHTML = getAccidentals(sig.count, sig.type)
                        .map(nota => `<span class="accidental-note ${classe}">${nota}</span>`)
                        .join('');
                    card.appendChild(listEl);
                }

                return card;
            }

            function renderKeys() {
                const label = NOTE_LABELS[selectedIndex];
                const tonalitaList = TONALITA_PER_ETICHETTA[label];
                if (!tonalitaList) return;

                resultsContainer.innerHTML = '';

                tonalitaList.forEach(item => {
                    const card = createCard(item.maggiore, item.minore);
                    if (card) resultsContainer.appendChild(card);
                });
            }

            calculateBtn.addEventListener('click', renderKeys);
            renderKeys();
        })();
    </script>
</body>
</html>
