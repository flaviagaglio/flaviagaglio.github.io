<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Keys · Flavia Gaglio</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --ink: #141310;
            --cream: #efe6d3;
            --panel: #f7f1e3;
            --orange: #ff4d1c;
            --blue: #1c3fff;
        }
        body {
            background: var(--cream);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background:
                radial-gradient(circle 3px at 18px 18px, var(--ink) 100%, transparent 101%),
                radial-gradient(circle 3px at calc(100% - 18px) 18px, var(--ink) 100%, transparent 101%),
                radial-gradient(circle 3px at 18px calc(100% - 18px), var(--ink) 100%, transparent 101%),
                radial-gradient(circle 3px at calc(100% - 18px) calc(100% - 18px), var(--ink) 100%, transparent 101%),
                var(--panel);
            border: 3px solid var(--ink);
            border-radius: 4px;
            padding: 2rem 1.5rem;
        }
        @media (min-width: 768px) {
            .container {
                padding: 3rem;
                border-width: 4px;
            }
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--ink);
            text-align: center;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        @media (min-width: 768px) {
            h1 { font-size: 3rem; }
        }
        .byline {
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(20, 19, 16, 0.55);
            display: table;
            margin: 0 auto 2rem;
            width: auto;
        }
        .byline a {
            color: inherit;
            text-decoration: underline;
            text-decoration-color: currentColor;
            text-underline-offset: 2px;
        }
        .byline a:hover {
            color: var(--orange);
        }
        @media (min-width: 768px) {
            .byline { font-size: 0.8rem; margin-bottom: 2.5rem; }
        }
        .selector-area {
            background: var(--cream);
            border: 2px solid var(--ink);
            border-radius: 4px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }
        @media (min-width: 768px) {
            .selector-area {
                padding: 2rem;
            }
        }
        .selector-label {
            text-align: center;
            font-family: 'Space Mono', monospace;
            color: var(--ink);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1.25rem;
            font-weight: 700;
        }
        .selector-label::before {
            content: '01 / ';
            opacity: 0.5;
        }
        @media (min-width: 768px) {
            .selector-label {
                font-size: 0.75rem;
                margin-bottom: 1.5rem;
            }
        }
        .note-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1.25rem;
            counter-reset: note;
        }
        .note-btn {
            counter-increment: note;
            position: relative;
            background: var(--panel);
            border: 2px solid var(--ink);
            border-radius: 3px;
            color: var(--ink);
            padding: 0.6rem 0.85rem 0.5rem;
            font-weight: 700;
            font-size: 0.9rem;
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.08s ease;
            min-width: 72px;
            flex: 0 1 auto;
        }
        .note-btn::before {
            content: counter(note, decimal-leading-zero);
            position: absolute;
            top: 3px;
            left: 5px;
            font-family: 'Space Mono', monospace;
            font-size: 0.55rem;
            font-weight: 400;
            opacity: 0.4;
        }
        @media (min-width: 480px) {
            .note-btn {
                padding: 0.75rem 1.1rem 0.6rem;
                font-size: 0.95rem;
                min-width: 82px;
            }
        }
        @media (min-width: 768px) {
            .note-btn {
                padding: 0.85rem 1.3rem 0.7rem;
                font-size: 1.05rem;
                min-width: 90px;
            }
        }
        .note-btn:hover {
            background: #ffffff;
        }
        .note-btn:active {
            transform: translateY(2px);
        }
        .note-btn.selected {
            background: var(--orange);
            border-color: var(--ink);
            color: var(--ink);
        }
        .note-btn.selected::before {
            opacity: 0.55;
        }
        .calculate-btn {
            background: var(--ink);
            color: var(--cream);
            border: 2px solid var(--ink);
            border-radius: 3px;
            padding: 0.95rem 2rem;
            font-weight: 700;
            font-size: 0.85rem;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
            margin: 0.25rem auto 0;
            display: block;
            transition: all 0.08s ease;
        }
        @media (min-width: 768px) {
            .calculate-btn {
                padding: 1.05rem 3rem;
                font-size: 0.9rem;
                max-width: 360px;
            }
        }
        .calculate-btn:hover {
            background: var(--orange);
            color: var(--ink);
        }
        .calculate-btn:active {
            transform: translateY(2px);
        }
        .results-label {
            font-family: 'Space Mono', monospace;
            color: var(--ink);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 700;
            margin-top: 1.75rem;
            margin-bottom: 0.75rem;
        }
        .results-label::before {
            content: '02 / ';
            opacity: 0.5;
        }
        .results-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        @media (min-width: 600px) {
            .results-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (min-width: 1024px) {
            .results-grid {
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            }
        }
        .result-card {
            background: var(--panel);
            border: 2px solid var(--ink);
            border-radius: 3px;
            padding: 1.5rem;
            text-align: center;
        }
        .key-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--ink);
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }
        @media (min-width: 768px) {
            .key-name { font-size: 1.75rem; }
        }
        .relative-minor {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--ink);
            opacity: 0.55;
            margin-bottom: 1.1rem;
        }
        .accidentals-count {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--ink);
            margin-bottom: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .accidentals-list {
            font-size: 1.2rem;
            font-weight: 700;
            background: var(--cream);
            padding: 0.65rem 1rem;
            border-radius: 3px;
            display: inline-block;
            border: 2px solid var(--ink);
        }
        .accidental-note {
            display: inline-block;
            margin: 0 0.22rem;
            font-weight: 700;
        }
        .sharp { color: var(--orange); }
        .flat { color: var(--blue); }
    </style>
</head>
<body>
    <div class="container">
        <h1>KEYS</h1>
        <div class="byline">by <a href="https://flaviagaglio.github.io" target="_blank" rel="noopener">Flavia Gaglio</a></div>

        <div class="selector-area">
            <div class="selector-label">circolo delle quinte</div>
            <div class="note-grid" id="noteGrid"></div>
            <button class="calculate-btn" id="calculate">Scopri l'armatura</button>
        </div>

        <div class="results-label">armatura</div>
        <div id="resultsContainer" class="results-grid"></div>
    </div>

    <script>
        (function() {
            // Ordine di comparsa delle alterazioni nel circolo delle quinte
            // (i bemolli seguono l'ordine esattamente inverso dei diesis).
            const SHARP_ORDER = ["Fa", "Do", "Sol", "Re", "La", "Mi", "Si"];
            const FLAT_ORDER  = ["Si", "Mi", "La", "Re", "Sol", "Do", "Fa"];

            // Ogni tonalità è definita solo da quante alterazioni ha e di che
            // tipo: le note alterate si calcolano prendendo le prime `count`
            // note di SHARP_ORDER/FLAT_ORDER, non vanno elencate a mano.
            const MAJOR_SIGNATURES = {
                "Do":    { count: 0, type: 'none' },
                "Do♭":   { count: 7, type: 'b' },
                "Do♯":   { count: 7, type: '#' },
                "Re♭":   { count: 5, type: 'b' },
                "Re":    { count: 2, type: '#' },
                "Mi♭":   { count: 3, type: 'b' },
                "Mi":    { count: 4, type: '#' },
                "Fa":    { count: 1, type: 'b' },
                "Fa♯":   { count: 6, type: '#' },
                "Sol♭":  { count: 6, type: 'b' },
                "Sol":   { count: 1, type: '#' },
                "Sol♯":  { count: 5, type: '#' },
                "La♭":   { count: 4, type: 'b' },
                "La":    { count: 3, type: '#' },
                "Si♭":   { count: 2, type: 'b' },
                "Si":    { count: 5, type: '#' }
            };

            function getAccidentals(count, type) {
                if (type === 'none' || count === 0) return [];
                const order = type === '#' ? SHARP_ORDER : FLAT_ORDER;
                const symbol = type === '#' ? '♯' : '♭';
                return order.slice(0, count).map(nota => nota + symbol);
            }

            const NOTE_LABELS = [
                "Do", "Sol", "Re", "La", "Mi", "Si/Do♭", "Fa♯/Sol♭", "Re♭/Do♯",
                "La♭", "Mi♭", "Si♭", "Fa"
            ];

            const TONALITA_PER_ETICHETTA = {
                "Do": [ { maggiore: "Do", minore: "La" } ],
                "Sol": [ { maggiore: "Sol", minore: "Mi" } ],
                "Re": [ { maggiore: "Re", minore: "Si" } ],
                "La": [ { maggiore: "La", minore: "Fa♯" } ],
                "Mi": [ { maggiore: "Mi", minore: "Do♯" } ],
                "Si/Do♭": [
                    { maggiore: "Si", minore: "Sol♯" },
                    { maggiore: "Do♭", minore: "La♭" }
                ],
                "Fa♯/Sol♭": [
                    { maggiore: "Fa♯", minore: "Re♯" },
                    { maggiore: "Sol♭", minore: "Mi♭" }
                ],
                "Re♭/Do♯": [
                    { maggiore: "Re♭", minore: "Si♭" },
                    { maggiore: "Do♯", minore: "La♯" }
                ],
                "La♭": [ { maggiore: "La♭", minore: "Fa" } ],
                "Mi♭": [ { maggiore: "Mi♭", minore: "Do" } ],
                "Si♭": [ { maggiore: "Si♭", minore: "Sol" } ],
                "Fa": [ { maggiore: "Fa", minore: "Re" } ]
            };

            let selectedIndex = 0;
            const noteGrid = document.getElementById('noteGrid');
            const calculateBtn = document.getElementById('calculate');
            const resultsContainer = document.getElementById('resultsContainer');

            NOTE_LABELS.forEach((label, idx) => {
                const btn = document.createElement('button');
                btn.className = 'note-btn' + (idx === 0 ? ' selected' : '');
                btn.textContent = label;
                btn.dataset.index = idx;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedIndex = idx;
                });
                noteGrid.appendChild(btn);
            });

            function createCard(maggiore, minore) {
                const sig = MAJOR_SIGNATURES[maggiore];
                if (!sig) return null;

                const card = document.createElement('div');
                card.className = 'result-card';

                const nameEl = document.createElement('div');
                nameEl.className = 'key-name';
                nameEl.textContent = `${maggiore} maggiore`;
                card.appendChild(nameEl);

                const relEl = document.createElement('div');
                relEl.className = 'relative-minor';
                relEl.textContent = `relativa minore: ${minore}`;
                card.appendChild(relEl);

                if (sig.count === 0) {
                    const countEl = document.createElement('div');
                    countEl.className = 'accidentals-count';
                    countEl.textContent = 'nessuna alterazione';
                    card.appendChild(countEl);
                    const listEl = document.createElement('div');
                    listEl.className = 'accidentals-list';
                    listEl.innerHTML = '♮';
                    card.appendChild(listEl);
                } else {
                    const tipo = sig.type === '#' ? 'diesis' : 'bemolli';
                    const countEl = document.createElement('div');
                    countEl.className = 'accidentals-count';
                    countEl.textContent = `${sig.count} ${tipo}`;
                    card.appendChild(countEl);

                    const listEl = document.createElement('div');
                    listEl.className = 'accidentals-list';
                    const classe = sig.type === '#' ? 'sharp' : 'flat';
                    listEl.innerHTML = getAccidentals(sig.count, sig.type)
                        .map(nota => `<span class="accidental-note ${classe}">${nota}</span>`)
                        .join('');
                    card.appendChild(listEl);
                }

                return card;
            }

            function renderKeys() {
                const label = NOTE_LABELS[selectedIndex];
                const tonalitaList = TONALITA_PER_ETICHETTA[label];
                if (!tonalitaList) return;

                resultsContainer.innerHTML = '';

                tonalitaList.forEach(item => {
                    const card = createCard(item.maggiore, item.minore);
                    if (card) resultsContainer.appendChild(card);
                });
            }

            calculateBtn.addEventListener('click', renderKeys);
            renderKeys();
        })();
    </script>
</body>
</html>
