<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Keys · Flavia Gaglio</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0 !important; }
        :root {
            --te-border: #1a1a1a;
            --te-dark: #121315;
            --te-chassis: #e5e1d5;
            --te-cream-bg: #f2efe6;
            --te-panel: #dcd7c8;
            --te-orange: #ff4400;
            --te-blue: #1c3fff;
        }
        body {
            background: var(--te-cream-bg);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            color: var(--te-border);
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: var(--te-chassis);
            border: 3px solid var(--te-border);
            box-shadow: 8px 8px 0 var(--te-dark);
            padding: 2rem 1.5rem;
        }
        @media (min-width: 768px) {
            .container {
                padding: 3rem;
                border-width: 4px;
            }
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--te-border);
            text-align: center;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        @media (min-width: 768px) {
            h1 { font-size: 3rem; }
        }
        .byline {
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(26, 26, 26, 0.55);
            display: table;
            margin: 0 auto 2rem;
            width: auto;
        }
        .byline a {
            color: inherit;
            text-decoration: underline;
            text-decoration-color: currentColor;
            text-underline-offset: 2px;
        }
        .byline a:hover {
            color: var(--te-orange);
        }
        @media (min-width: 768px) {
            .byline { font-size: 0.8rem; margin-bottom: 2.5rem; }
        }
        .selector-area {
            background: var(--te-panel);
            border: 2px solid var(--te-border);
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }
        @media (min-width: 768px) {
            .selector-area {
                padding: 2rem;
            }
        }
        .selector-label {
            text-align: center;
            font-family: 'Space Mono', monospace;
            color: var(--te-border);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1.25rem;
            font-weight: 700;
        }
        .selector-label::before {
            content: '01 / ';
            opacity: 0.5;
        }
        @media (min-width: 768px) {
            .selector-label {
                font-size: 0.75rem;
                margin-bottom: 1.5rem;
            }
        }
        .note-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            margin-bottom: 1.25rem;
            counter-reset: note;
        }
        .note-btn {
            counter-increment: note;
            position: relative;
            background: var(--te-cream-bg);
            border: 2px solid var(--te-border);
            box-shadow: 3px 3px 0 var(--te-border);
            color: var(--te-border);
            padding: 0.6rem 0.85rem 0.5rem;
            font-weight: 700;
            font-size: 0.9rem;
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.08s ease;
            min-width: 72px;
            flex: 0 1 auto;
        }
        .note-btn::before {
            content: counter(note, decimal-leading-zero);
            position: absolute;
            top: 3px;
            left: 5px;
            font-family: 'Space Mono', monospace;
            font-size: 0.55rem;
            font-weight: 400;
            opacity: 0.4;
        }
        @media (min-width: 480px) {
            .note-btn {
                padding: 0.75rem 1.1rem 0.6rem;
                font-size: 0.95rem;
                min-width: 82px;
            }
        }
        @media (min-width: 768px) {
            .note-btn {
                padding: 0.85rem 1.3rem 0.7rem;
                font-size: 1.05rem;
                min-width: 90px;
            }
        }
        .note-btn:hover {
            background: #ffffff;
        }
        .note-btn:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }
        .note-btn.selected {
            background: var(--te-orange);
            border-color: var(--te-border);
            color: var(--te-border);
        }
        .note-btn.selected::before {
            opacity: 0.55;
        }
        .calculate-btn {
            background: var(--te-border);
            color: var(--te-cream-bg);
            border: 2px solid var(--te-border);
            box-shadow: 4px 4px 0 var(--te-orange);
            padding: 0.95rem 2rem;
            font-weight: 700;
            font-size: 0.85rem;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
            margin: 0.25rem auto 0;
            display: block;
            transition: 0.08s ease;
        }
        @media (min-width: 768px) {
            .calculate-btn {
                padding: 1.05rem 3rem;
                font-size: 0.9rem;
                max-width: 360px;
            }
        }
        .calculate-btn:hover {
            background: var(--te-orange);
            color: var(--te-border);
        }
        .calculate-btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }
        .results-label {
            font-family: 'Space Mono', monospace;
            color: var(--te-border);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 700;
            margin-top: 1.75rem;
            margin-bottom: 0.75rem;
        }
        .results-label::before {
            content: '02 / ';
            opacity: 0.5;
        }
        .results-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        @media (min-width: 600px) {
            .results-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (min-width: 1024px) {
            .results-grid {
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            }
        }
        .result-card {
            background: var(--te-panel);
            border: 2px solid var(--te-border);
            padding: 1.5rem;
            text-align: center;
        }
        .key-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--te-border);
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }
        @media (min-width: 768px) {
            .key-name { font-size: 1.75rem; }
        }
        .relative-minor {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--te-border);
            opacity: 0.55;
            margin-bottom: 1.1rem;
        }
        .accidentals-count {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--te-border);
            margin-bottom: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .accidentals-list {
            font-size: 1.2rem;
            font-weight: 700;
            background: var(--te-cream-bg);
            padding: 0.65rem 1rem;
            display: inline-block;
            border: 2px solid var(--te-border);
        }
        .accidental-note {
            display: inline-block;
            margin: 0 0.22rem;
            font-weight: 700;
        }
        .sharp { color: var(--te-orange); }
        .flat { color: var(--te-blue); }
    </style>
</head>
<body>
    <div class="container">
        <h1>KEYS</h1>
        <div class="byline">by <a href="https://flaviagaglio.github.io" target="_blank" rel="noopener">Flavia Gaglio</a></div>

        <div class="selector-area">
            <div class="selector-label">circle of fifths</div>
            <div class="note-grid" id="noteGrid"></div>
            <button class="calculate-btn" id="calculate">Find Key Signature</button>
        </div>

        <div class="results-label">key signature</div>
        <div id="resultsContainer" class="results-grid"></div>
    </div>

    <script>
        (function() {
            // Order in which accidentals appear around the circle of fifths
            // (flats follow the exact reverse order of sharps).
            const SHARP_ORDER = ["F", "C", "G", "D", "A", "E", "B"];
            const FLAT_ORDER  = ["B", "E", "A", "D", "G", "C", "F"];

            // Each key is defined only by how many accidentals it has and of
            // which kind: the altered notes are derived by taking the first
            // `count` notes of SHARP_ORDER/FLAT_ORDER, not listed by hand.
            const MAJOR_SIGNATURES = {
                "C":  { count: 0, type: 'none' },
                "C♭": { count: 7, type: 'b' },
                "C♯": { count: 7, type: '#' },
                "D♭": { count: 5, type: 'b' },
                "D":  { count: 2, type: '#' },
                "E♭": { count: 3, type: 'b' },
                "E":  { count: 4, type: '#' },
                "F":  { count: 1, type: 'b' },
                "F♯": { count: 6, type: '#' },
                "G♭": { count: 6, type: 'b' },
                "G":  { count: 1, type: '#' },
                "G♯": { count: 5, type: '#' },
                "A♭": { count: 4, type: 'b' },
                "A":  { count: 3, type: '#' },
                "B♭": { count: 2, type: 'b' },
                "B":  { count: 5, type: '#' }
            };

            function getAccidentals(count, type) {
                if (type === 'none' || count === 0) return [];
                const order = type === '#' ? SHARP_ORDER : FLAT_ORDER;
                const symbol = type === '#' ? '♯' : '♭';
                return order.slice(0, count).map(note => note + symbol);
            }

            const NOTE_LABELS = [
                "C", "G", "D", "A", "E", "B/C♭", "F♯/G♭", "D♭/C♯",
                "A♭", "E♭", "B♭", "F"
            ];

            const KEYS_BY_LABEL = {
                "C": [ { major: "C", minor: "A" } ],
                "G": [ { major: "G", minor: "E" } ],
                "D": [ { major: "D", minor: "B" } ],
                "A": [ { major: "A", minor: "F♯" } ],
                "E": [ { major: "E", minor: "C♯" } ],
                "B/C♭": [
                    { major: "B", minor: "G♯" },
                    { major: "C♭", minor: "A♭" }
                ],
                "F♯/G♭": [
                    { major: "F♯", minor: "D♯" },
                    { major: "G♭", minor: "E♭" }
                ],
                "D♭/C♯": [
                    { major: "D♭", minor: "B♭" },
                    { major: "C♯", minor: "A♯" }
                ],
                "A♭": [ { major: "A♭", minor: "F" } ],
                "E♭": [ { major: "E♭", minor: "C" } ],
                "B♭": [ { major: "B♭", minor: "G" } ],
                "F": [ { major: "F", minor: "D" } ]
            };

            let selectedIndex = 0;
            const noteGrid = document.getElementById('noteGrid');
            const calculateBtn = document.getElementById('calculate');
            const resultsContainer = document.getElementById('resultsContainer');

            NOTE_LABELS.forEach((label, idx) => {
                const btn = document.createElement('button');
                btn.className = 'note-btn' + (idx === 0 ? ' selected' : '');
                btn.textContent = label;
                btn.dataset.index = idx;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedIndex = idx;
                });
                noteGrid.appendChild(btn);
            });

            function createCard(major, minor) {
                const sig = MAJOR_SIGNATURES[major];
                if (!sig) return null;

                const card = document.createElement('div');
                card.className = 'result-card';

                const nameEl = document.createElement('div');
                nameEl.className = 'key-name';
                nameEl.textContent = `${major} major`;
                card.appendChild(nameEl);

                const relEl = document.createElement('div');
                relEl.className = 'relative-minor';
                relEl.textContent = `relative minor: ${minor}`;
                card.appendChild(relEl);

                if (sig.count === 0) {
                    const countEl = document.createElement('div');
                    countEl.className = 'accidentals-count';
                    countEl.textContent = 'no accidentals';
                    card.appendChild(countEl);
                    const listEl = document.createElement('div');
                    listEl.className = 'accidentals-list';
                    listEl.innerHTML = '♮';
                    card.appendChild(listEl);
                } else {
                    const isSharp = sig.type === '#';
                    const kind = isSharp
                        ? (sig.count === 1 ? 'sharp' : 'sharps')
                        : (sig.count === 1 ? 'flat' : 'flats');
                    const countEl = document.createElement('div');
                    countEl.className = 'accidentals-count';
                    countEl.textContent = `${sig.count} ${kind}`;
                    card.appendChild(countEl);

                    const listEl = document.createElement('div');
                    listEl.className = 'accidentals-list';
                    const cssClass = isSharp ? 'sharp' : 'flat';
                    listEl.innerHTML = getAccidentals(sig.count, sig.type)
                        .map(note => `<span class="accidental-note ${cssClass}">${note}</span>`)
                        .join('');
                    card.appendChild(listEl);
                }

                return card;
            }

            function renderKeys() {
                const label = NOTE_LABELS[selectedIndex];
                const keysList = KEYS_BY_LABEL[label];
                if (!keysList) return;

                resultsContainer.innerHTML = '';

                keysList.forEach(item => {
                    const card = createCard(item.major, item.minor);
                    if (card) resultsContainer.appendChild(card);
                });
            }

            calculateBtn.addEventListener('click', renderKeys);
            renderKeys();
        })();
    </script>
</body>
</html>
