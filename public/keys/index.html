<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Keys · Flavia Gaglio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            padding: 1.75rem;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 32px rgba(15, 23, 42, 0.06);
            border: 1px solid #e2e8f0;
        }
        @media (min-width: 768px) {
            .container {
                padding: 3rem;
                border-radius: 20px;
            }
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0f172a;
            text-align: center;
            letter-spacing: -0.01em;
            margin-bottom: 0.35rem;
        }
        @media (min-width: 768px) {
            h1 { font-size: 2rem; }
        }
        .byline {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            display: table;
            margin: 0 auto 1.75rem;
            width: auto;
        }
        @media (min-width: 768px) {
            .byline { font-size: 0.95rem; margin-bottom: 2.5rem; }
        }
        .selector-area {
            background: #f8fafc;
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }
        @media (min-width: 768px) {
            .selector-area {
                padding: 2rem;
                border-radius: 16px;
            }
        }
        .selector-label {
            text-align: center;
            color: #64748b;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 1.25rem;
            font-weight: 700;
        }
        @media (min-width: 768px) {
            .selector-label {
                font-size: 0.8rem;
                margin-bottom: 1.5rem;
            }
        }
        .note-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .note-btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #334155;
            padding: 0.55rem 0.85rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.12s ease;
            min-width: 70px;
            flex: 0 1 auto;
        }
        @media (min-width: 480px) {
            .note-btn {
                padding: 0.7rem 1.1rem;
                font-size: 0.95rem;
                min-width: 80px;
            }
        }
        @media (min-width: 768px) {
            .note-btn {
                padding: 0.8rem 1.3rem;
                font-size: 1rem;
                min-width: 88px;
            }
        }
        .note-btn:hover {
            border-color: #4f46e5;
            color: #4f46e5;
        }
        .note-btn:active {
            transform: scale(0.97);
        }
        .note-btn.selected {
            background: #4f46e5;
            border-color: #4f46e5;
            color: #ffffff;
        }
        .note-btn.selected:hover {
            color: #ffffff;
        }
        .calculate-btn {
            background: #4f46e5;
            color: #ffffff;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.01em;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
            margin: 0.5rem auto 0;
            display: block;
            transition: background 0.12s ease;
        }
        @media (min-width: 768px) {
            .calculate-btn {
                padding: 1rem 3rem;
                font-size: 1.05rem;
                max-width: 360px;
            }
        }
        .calculate-btn:hover {
            background: #4338ca;
        }
        .calculate-btn:active {
            transform: scale(0.98);
        }
        .results-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-top: 2rem;
        }
        @media (min-width: 600px) {
            .results-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (min-width: 1024px) {
            .results-grid {
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            }
        }
        .result-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #e2e8f0;
            text-align: center;
            transition: border-color 0.12s ease;
        }
        .result-card:hover {
            border-color: #c7d2fe;
        }
        .key-name {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.25rem;
        }
        @media (min-width: 768px) {
            .key-name { font-size: 1.6rem; }
        }
        .relative-minor {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 1.1rem;
        }
        .accidentals-count {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .accidentals-list {
            font-size: 1.2rem;
            font-weight: 700;
            background: #f8fafc;
            padding: 0.65rem 1rem;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #e2e8f0;
        }
        .accidental-note {
            display: inline-block;
            margin: 0 0.22rem;
            font-weight: 700;
        }
        .sharp { color: #4f46e5; }
        .flat { color: #0d9488; }
    </style>
</head>
<body>
    <div class="container">
        <h1>KEYS</h1>
        <div class="byline">by Flavia Gaglio</div>

        <div class="selector-area">
            <div class="selector-label">circolo delle quinte</div>
            <div class="note-grid" id="noteGrid"></div>
            <button class="calculate-btn" id="calculate">Scopri l'armatura</button>
        </div>

        <div id="resultsContainer" class="results-grid"></div>
    </div>

    <script>
        (function() {
            // Ordine di comparsa delle alterazioni nel circolo delle quinte
            // (i bemolli seguono l'ordine esattamente inverso dei diesis).
            const SHARP_ORDER = ["Fa", "Do", "Sol", "Re", "La", "Mi", "Si"];
            const FLAT_ORDER  = ["Si", "Mi", "La", "Re", "Sol", "Do", "Fa"];

            // Ogni tonalità è definita solo da quante alterazioni ha e di che
            // tipo: le note alterate si calcolano prendendo le prime `count`
            // note di SHARP_ORDER/FLAT_ORDER, non vanno elencate a mano.
            const MAJOR_SIGNATURES = {
                "Do":    { count: 0, type: 'none' },
                "Do♭":   { count: 7, type: 'b' },
                "Do♯":   { count: 7, type: '#' },
                "Re♭":   { count: 5, type: 'b' },
                "Re":    { count: 2, type: '#' },
                "Mi♭":   { count: 3, type: 'b' },
                "Mi":    { count: 4, type: '#' },
                "Fa":    { count: 1, type: 'b' },
                "Fa♯":   { count: 6, type: '#' },
                "Sol♭":  { count: 6, type: 'b' },
                "Sol":   { count: 1, type: '#' },
                "Sol♯":  { count: 5, type: '#' },
                "La♭":   { count: 4, type: 'b' },
                "La":    { count: 3, type: '#' },
                "Si♭":   { count: 2, type: 'b' },
                "Si":    { count: 5, type: '#' }
            };

            function getAccidentals(count, type) {
                if (type === 'none' || count === 0) return [];
                const order = type === '#' ? SHARP_ORDER : FLAT_ORDER;
                const symbol = type === '#' ? '♯' : '♭';
                return order.slice(0, count).map(nota => nota + symbol);
            }

            const NOTE_LABELS = [
                "Do", "Sol", "Re", "La", "Mi", "Si/Do♭", "Fa♯/Sol♭", "Re♭/Do♯",
                "La♭", "Mi♭", "Si♭", "Fa"
            ];

            const TONALITA_PER_ETICHETTA = {
                "Do": [ { maggiore: "Do", minore: "La" } ],
                "Sol": [ { maggiore: "Sol", minore: "Mi" } ],
                "Re": [ { maggiore: "Re", minore: "Si" } ],
                "La": [ { maggiore: "La", minore: "Fa♯" } ],
                "Mi": [ { maggiore: "Mi", minore: "Do♯" } ],
                "Si/Do♭": [
                    { maggiore: "Si", minore: "Sol♯" },
                    { maggiore: "Do♭", minore: "La♭" }
                ],
                "Fa♯/Sol♭": [
                    { maggiore: "Fa♯", minore: "Re♯" },
                    { maggiore: "Sol♭", minore: "Mi♭" }
                ],
                "Re♭/Do♯": [
                    { maggiore: "Re♭", minore: "Si♭" },
                    { maggiore: "Do♯", minore: "La♯" }
                ],
                "La♭": [ { maggiore: "La♭", minore: "Fa" } ],
                "Mi♭": [ { maggiore: "Mi♭", minore: "Do" } ],
                "Si♭": [ { maggiore: "Si♭", minore: "Sol" } ],
                "Fa": [ { maggiore: "Fa", minore: "Re" } ]
            };

            let selectedIndex = 0;
            const noteGrid = document.getElementById('noteGrid');
            const calculateBtn = document.getElementById('calculate');
            const resultsContainer = document.getElementById('resultsContainer');

            NOTE_LABELS.forEach((label, idx) => {
                const btn = document.createElement('button');
                btn.className = 'note-btn' + (idx === 0 ? ' selected' : '');
                btn.textContent = label;
                btn.dataset.index = idx;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedIndex = idx;
                });
                noteGrid.appendChild(btn);
            });

            function createCard(maggiore, minore) {
                const sig = MAJOR_SIGNATURES[maggiore];
                if (!sig) return null;

                const card = document.createElement('div');
                card.className = 'result-card';

                const nameEl = document.createElement('div');
                nameEl.className = 'key-name';
                nameEl.textContent = `${maggiore} maggiore`;
                card.appendChild(nameEl);

                const relEl = document.createElement('div');
                relEl.className = 'relative-minor';
                relEl.textContent = `relativa minore: ${minore}`;
                card.appendChild(relEl);

                if (sig.count === 0) {
                    const countEl = document.createElement('div');
                    countEl.className = 'accidentals-count';
                    countEl.textContent = 'nessuna alterazione';
                    card.appendChild(countEl);
                    const listEl = document.createElement('div');
                    listEl.className = 'accidentals-list';
                    listEl.innerHTML = '♮';
                    card.appendChild(listEl);
                } else {
                    const tipo = sig.type === '#' ? 'diesis' : 'bemolli';
                    const countEl = document.createElement('div');
                    countEl.className = 'accidentals-count';
                    countEl.textContent = `${sig.count} ${tipo}`;
                    card.appendChild(countEl);

                    const listEl = document.createElement('div');
                    listEl.className = 'accidentals-list';
                    const classe = sig.type === '#' ? 'sharp' : 'flat';
                    listEl.innerHTML = getAccidentals(sig.count, sig.type)
                        .map(nota => `<span class="accidental-note ${classe}">${nota}</span>`)
                        .join('');
                    card.appendChild(listEl);
                }

                return card;
            }

            function renderKeys() {
                const label = NOTE_LABELS[selectedIndex];
                const tonalitaList = TONALITA_PER_ETICHETTA[label];
                if (!tonalitaList) return;

                resultsContainer.innerHTML = '';

                tonalitaList.forEach(item => {
                    const card = createCard(item.maggiore, item.minore);
                    if (card) resultsContainer.appendChild(card);
                });
            }

            calculateBtn.addEventListener('click', renderKeys);
            renderKeys();
        })();
    </script>
</body>
</html>
